services:
  timescaledb:
    image: timescale/timescaledb-ha:pg18
    container_name: timescaledb
    restart: unless-stopped # Recommended for better uptime
    ports:
      - "6543:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data # Critical for data persistence

volumes:
  timescaledb_data: {}